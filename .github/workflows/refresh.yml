name: Refresh Darvas scanner

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC = 07:30 IST daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scanner
        run: node fetch-darvas.js --index=250
      - name: Build dashboard
        run: node build.js
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add darvas.json index.html
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-refresh Darvas scan $(date -u +%Y-%m-%d)"
          git push
      - name: Deploy to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          exclude_assets: 'lib,fetch-darvas.js,build.js,test.js,package.json,README.md,.github,.gitignore'
