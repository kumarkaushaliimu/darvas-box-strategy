name: Refresh Darvas scanner

on:
  schedule:
    # Every day at 07:30 IST (02:00 UTC). Change the cron to suit your timezone.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scanner
        run: node fetch-darvas.js --index=250

      - name: Build dashboard
        run: node build.js

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add darvas.json index.html
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "Auto-refresh Darvas scan $(date -u +%Y-%m-%d)"; git push; fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
